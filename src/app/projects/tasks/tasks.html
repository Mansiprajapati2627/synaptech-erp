<!-- src/app/projects/tasks/tasks.html -->
<div class="tasks-shell">
  <h1>All Tasks</h1>
  <div class="toolbar">
    <input [(ngModel)]="searchTerm" placeholder="🔍 Search tasks…">
    <select [(ngModel)]="statusFilter">
      <option value="">All statuses</option>
      <option value="To do">To do</option>
      <option value="In progress">In progress</option>
      <option value="Done">Done</option>
      <option value="Blocked">Blocked</option>
    </select>
    <select [(ngModel)]="assigneeFilter">
      <option value="">All assignees</option>
      @for (user of allUsers; track user) {
        <option [value]="user">{{ user }}</option>
      }
    </select>
  </div>

  <div class="task-table">
    <div class="table-head">
      <span>Task</span><span>Project</span><span>Assignee</span><span>Due</span><span>Status</span>
    </div>
    @for (task of filteredTasks; track task.id) {
      <div class="task-row">
        <span>{{ task.title }}</span>
        <span><a [routerLink]="['/projects', task.projectName]">{{ task.projectName }}</a></span>
        <span>{{ task.assignedTo || 'Unassigned' }}</span>
        <span>{{ task.dueDate || '—' }}</span>
        <span class="status-badge" [class]="task.status || 'To do'">{{ task.status || 'To do' }}</span>
      </div>
    } @empty {
      <p class="empty-state">✨ No tasks match your filters. Great job!</p>
    }
  </div>
</div>
