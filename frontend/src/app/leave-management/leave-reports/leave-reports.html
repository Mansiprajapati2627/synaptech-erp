<app-erp-page>
<main class="page-main">
  <header>
    <div>
      <p class="eyebrow">Leave & Analytics</p>
      <h1>Leave Reports</h1>
      <p class="intro">Annual leave utilization, trends, and department time-off reports.</p>
    </div>
  </header>

  <section class="monthly-stats" style="margin-top: 1rem;">

      <div class="stat-item"><span class="label">Total Approved Leaves</span><span class="value">14 Days</span></div>

      <div class="stat-item"><span class="label">Sick Leaves Taken</span><span class="value">6 Days</span></div>
      <div class="stat-item"><span class="label">Avg Leave per Employee</span><span class="value">2.4 Days</span></div>
    </div>
  </section>
</main>
</app-erp-page>
